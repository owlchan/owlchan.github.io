<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おうるちゃんのリンク集</title>
<meta name="description" content="保険を売らない中立なFP・おうるちゃんの無料特典とおすすめ記事">
<style>
  :root{
    --bg:#FBF6EE; --card:#FFFFFF; --ink:#2B2A28; --muted:#77716A; --line:#EFE6D8;
    --accent:#2F6B5A; --shadow:0 4px 14px rgba(80,60,30,.08);
    --font:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1A1916; --card:#24221E; --ink:#EEE9E0; --muted:#A9A296; --line:#3A362F;
      --accent:#7CC3AC; --shadow:0 4px 14px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1A1916; --card:#24221E; --ink:#EEE9E0; --muted:#A9A296; --line:#3A362F;
    --accent:#7CC3AC; --shadow:0 4px 14px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7}
  .wrap{max-width:460px;margin:0 auto;padding:24px 16px 48px}
  .draft{background:#FFF3D4;color:#7A5200;border-radius:10px;padding:10px 14px;font-size:12px;margin-bottom:20px}
  .todo{color:#A0522D;font-weight:700}

  header{text-align:center;margin-bottom:26px}
  .avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid var(--card);box-shadow:var(--shadow);background:var(--card)}
  h1{font-size:20px;margin:10px 0 0;letter-spacing:.04em}
  .role{font-size:12.5px;color:var(--muted);margin-top:2px}
  .catch{display:inline-block;margin-top:12px;font-size:13.5px;font-weight:700;color:var(--accent)}

  .card{display:block;background:var(--card);border-radius:18px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:transform .12s ease}
  .card:active{transform:scale(.98)}
  .card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--line)}

  /* 大きいカード（1列） */
  .big{display:grid;gap:18px}
  .body{display:flex;align-items:center;gap:10px;padding:12px 16px 14px}
  .text{flex:1;min-width:0}
  .for{font-size:13.5px;font-weight:700;line-height:1.5}
  .what{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.55}
  .go{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}

  /* 小さいカード（2列） */
  .sec{font-size:13px;color:var(--muted);text-align:center;margin:32px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .grid .card{border-radius:14px}
  .grid .title{padding:8px 10px 10px;font-size:12.5px;font-weight:700;line-height:1.45}

  footer{text-align:center;font-size:11.5px;color:var(--muted);margin-top:36px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img class="avatar" src="img/avatar.png" alt="おうるちゃん">
    <h1>おうるちゃん</h1>
    <div class="role">保険を売らない中立なFP｜4歳・2歳のママ</div>
    <div class="catch">＼ 正しい保険で、自分と子どもを守る ／</div>
  </header>

  <div class="big">
    <a class="card" href="https://owlchan-money.com/kouryaku-present/">
      <img src="img/tokuten10.png" alt="保険＋教育資金 攻略10大特典（面談前ガイド・家族構成別保険攻略・教育資金シミュレーター・家計簿診断アプリなど）">
      <div class="body"><div class="text">
        <div class="for">保険と教育資金の「10大特典」</div>
        <div class="what">相談準備ガイド・教育資金シミュレーター・家計簿診断アプリなど。800人以上が受け取り中</div>
      </div><span class="go" aria-hidden="true">›</span></div>
    </a>

    <a class="card" href="https://owlchan-money.com/openchat">
      <img src="img/openchat.png" alt="おうるのマネリテ向上部屋 オープンチャット">
      <div class="body"><div class="text">
        <div class="for">匿名・無料のオープンチャット</div>
        <div class="what">大事なお金の情報だけを厳選してお届け。LINEの名前はばれません</div>
      </div><span class="go" aria-hidden="true">›</span></div>
    </a>
  </div>

  <div class="sec">人気の記事・ラジオ</div>

  <div class="grid">
    <a class="card" href="https://owlchan-money.com/hoken_down/">
      <img src="img/hoken.png" alt="保険料を安くする改善ポイント7選">
      <div class="title">保険料DOWNのコツ7選</div>
    </a>
    <a class="card" href="https://owlchan-money.com/interest-rate-negotiation/">
      <img src="img/loan.png" alt="住宅ローン金利交渉ガイド">
      <div class="title">住宅ローン金利交渉ガイド</div>
    </a>
    <a class="card" href="https://owlchan-money.com/nisa/">
      <img src="img/nisa.png" alt="NISAまるわかりガイド">
      <div class="title">NISAの超基本</div>
    </a>
    <a class="card" href="https://stand.fm/channels/6739615369bc2015d05347e2">
      <img src="img/radio.png" alt="お金と子どもを育てるラジオ">
      <div class="title">お金のラジオ（毎週更新）</div>
    </a>
  </div>

  <footer>おうるちゃん｜保険を売らない中立なFP<br>Instagram @owlchan0money</footer>
</div>
</body>
</html>
